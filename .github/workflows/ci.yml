# The ONE approved workflow (plan §1.11). Adding any other workflow file needs
# Anton's explicit yes — the pre-commit hook blocks new ones by default.
name: CI

# No paths-ignore: `check` is a required status for auto-merge, and a required
# check that never reports leaves docs-only PRs stuck forever (review 2026-09-11 P2).
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_BRAND_NAME: Profesionales
